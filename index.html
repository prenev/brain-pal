<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wobbi" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wobbi</title>
    <style>
      html, body { margin: 0; background: #0e1726; }
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #e8edf8; font: 800 26px/1 system-ui, sans-serif; }
      .boot img { border-radius: 28px; animation: bootBob 2.6s ease-in-out infinite; }
      @keyframes bootBob { 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-label="Wobbi is loading"><img src="/icon-192.png" alt="" width="120" height="120" /><b>Wobbi</b></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
