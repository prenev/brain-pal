name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:            # real Postgres for the migration + row-level-security tests (npm run test:db)
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Install Chromium for e2e
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e -- --no-build
