name: iOS build
# Compiles the iPhone app (Swift HealthKit plugin, Capacitor, entitlements) for the simulator with signing disabled.
# macOS minutes are billed at 10x on private repos, so this runs only when iOS-related files change (or on demand).
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', 'ios-native/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', 'scripts/ios-patch.py']
  pull_request:
    paths: ['ios/**', 'ios-native/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', 'scripts/ios-patch.py']
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ios:sync
      - name: Patched project must match what is committed
        run: git diff --exit-code -- ios/App/App.xcodeproj ios/App/App/Info.plist ios/App/App/SceneDelegate.swift ios/App/App/MindfulPlugin.swift ios/App/App/MainViewController.swift ios/App/App/BrainPalIntents.swift ios/App/App/App.entitlements ios/App/App/PrivacyInfo.xcprivacy
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
